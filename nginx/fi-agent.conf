# ============================================================
#  COPY-PASTE THESE BLOCKS into your nginx.conf
#
#  1. The map block goes inside http {}  (add once, globally)
#  2. The location blocks go inside your server {}
#
#  /fi/ws/*  — WebSocket (session + Sarvam STT proxy) → FastAPI :8000
#  /fi/*     — Web app + REST API                     → FastAPI :8000
#  /         — Admin dashboard                        → FastAPI :8000
# ============================================================

# ── 1. Add inside http {} ─────────────────────────────────────────────────────

#   map $http_upgrade $connection_upgrade {
#       default  upgrade;
#       ''       close;
#   }

# ── 2. Add inside server {} ───────────────────────────────────────────────────

    # WebSocket — session conductor + Sarvam STT proxy
    location /fi/ws/ {
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection $connection_upgrade;
        proxy_set_header    Host       $host;
        proxy_set_header    X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # FI web app + REST API + file downloads
    location /fi/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 600m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # Admin dashboard
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

